<style>
:root{
  --paper:#f7f4ef;
  --card:#fffdfa;
  --ink:#191713;
  --ink2:#4c463d;
  --ink3:#8c8478;
  --line:#e2dbcf;
  --accent:#a8542a;
  --cash:#b08420;
  --stand:#2f6076;
  --reach:#7a3f66;

}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

.wrap{max-width:840px;margin:0 auto;position:relative;z-index:2}

/* ---------- HUD ---------- */
.hud{
  display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  border:1px solid var(--line);background:var(--card);
  padding:13px 18px;border-radius:3px;margin-bottom:16px;
}
.hud.hide{display:none}
.meters{display:flex;gap:20px;flex-wrap:wrap}
.meter{min-width:92px}
.meter .lbl{
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:600;
}
.meter .lbl b{color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:4px;background:#ece5d9;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.exec{flex:1 1 220px;min-width:190px}
.exec .lbl,.exec .lbl b{color:var(--exec)}
.exec .bar{height:5px}
.hudright{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#e2dbcf;transition:.3s}
.dot.on{background:var(--ink);transform:scale(1.15)}
.dot.cur{background:var(--accent);transform:scale(1.4)}
.rst{
  border:1px solid var(--line);background:transparent;color:var(--ink3);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:6px 10px;border-radius:2px;cursor:pointer;font-family:inherit;transition:.18s;
}
.rst:hover{border-color:var(--ink);color:var(--ink)}
.langs{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.langs button{
  border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink3);
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:6px 10px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.langs button:last-child{border-right:0}
.langs button:hover{background:#f3efe8;color:var(--ink)}
.langs button.active{background:var(--ink);color:#fff}

/* ---------- CARD ---------- */
.card{
  border:1px solid var(--line);background:var(--card);border-radius:3px;
  padding:40px 46px 44px;
  box-shadow:0 1px 0 rgba(0,0,0,.02), 0 22px 46px -34px rgba(30,20,10,.45);
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.kicker{

  margin-bottom:16px;font-weight:700;
}
h1{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:clamp(32px,6vw,48px);line-height:1.08;letter-spacing:-.02em;margin-bottom:14px}
h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:clamp(23px,4vw,30px);line-height:1.18;letter-spacing:-.015em;margin-bottom:24px}
.lede{font-family:Georgia,serif;font-size:17px;line-height:1.75;color:var(--ink2);margin-bottom:14px}
.prose p{font-family:Georgia,"Iowan Old Style",serif;font-size:16.5px;line-height:1.82;color:var(--ink2);margin-bottom:17px}
.prose p:last-child{margin-bottom:0}
.prose em{color:var(--ink);font-style:italic}
.rule{height:1px;background:var(--line);margin:30px 0 26px}
.prompt{
  margin:28px 0 20px;padding:2px 0 2px 18px;border-left:2px solid var(--accent);
  font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.65;
}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  text-align:left;border:1px solid var(--line);background:#fff;border-radius:3px;
  padding:15px 18px;font-size:14.5px;line-height:1.55;color:var(--ink2);
  cursor:pointer;transition:.18s ease;display:flex;gap:14px;align-items:flex-start;
  font-family:inherit;width:100%;
}
.opt:hover{border-color:var(--ink);background:#fdfbf7;transform:translateX(3px)}
.opt .n{
  font-size:11px;font-weight:700;color:var(--ink3);border:1px solid var(--line);
  border-radius:2px;width:21px;height:21px;display:grid;place-items:center;flex:none;margin-top:1px;
  transition:.18s;
}
.opt:hover .n{border-color:var(--accent);color:var(--accent)}

/* ---------- OUTCOME ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 4px}
.chip{
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:6px 10px;border-radius:2px;border:1px solid var(--line);color:var(--ink2);
  animation:fade .5s ease both;
}
.chip.up{color:#7a5a12;border-color:#e6d7ae;background:#fdf8ea}
.chip.dn{color:#8d5a52;border-color:#e8d3ce;background:#fdf2ef}
.lesson{
  margin-top:28px;border:1px solid var(--line);border-left:3px solid var(--accent);
  background:#fbf8f3;padding:20px 22px;border-radius:2px;
}
.lesson .tag{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:10px;
}
.lesson p{font-family:Georgia,serif;font-size:16px;line-height:1.75;color:var(--ink)}

/* ---------- BUTTONS ---------- */
.acts{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-family:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:13px 26px;border-radius:2px;cursor:pointer;transition:.18s;
}
.btn:hover{background:#000;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{background:#f3efe8;color:var(--ink);border-color:var(--ink)}
.hint{font-size:11px;color:var(--ink3);letter-spacing:.03em}

/* ---------- TITLE ---------- */
.toolart{margin:6px 0 30px}
.toolart svg{display:block;width:100%;max-width:420px;height:auto}
.stamp{
  display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);
  padding:7px 12px;border-radius:2px;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:26px;
}
.stamp i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}

/* ---------- ENDING ---------- */
.rank{
  border:1px solid var(--line);background:#fbf8f3;border-radius:3px;
  padding:28px 30px;margin-bottom:26px;
}
.rank .rt{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:12px}
.rank h3{font-family:Georgia,serif;font-size:28px;letter-spacing:-.015em;margin-bottom:12px}
.rank p{font-family:Georgia,serif;font-size:16px;line-height:1.75;color:var(--ink2)}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin-bottom:26px}
.sg{border:1px solid var(--line);border-radius:2px;padding:14px 16px;background:#fff}
.sg .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:7px}
.sg .v{font-family:Georgia,serif;font-size:26px;font-variant-numeric:tabular-nums}
.recap{list-style:none;counter-reset:r}
.recap li{
  counter-increment:r;position:relative;padding-left:44px;margin-bottom:20px;
  font-family:Georgia,serif;font-size:15.5px;line-height:1.7;color:var(--ink2);
}
.recap li::before{
  content:counter(r,decimal-leading-zero);position:absolute;left:0;top:2px;
  font-family:"Segoe UI",sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;
  color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:3px;
}
.recap li b{color:var(--ink);font-weight:600}
.closing{
  border:1px solid var(--ink);background:var(--ink);color:#f2ece2;
  border-radius:3px;padding:34px 36px;margin-top:32px;
}
.closing .tag{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#c9a884;font-weight:700;margin-bottom:18px}
.closing p{font-family:Georgia,serif;font-size:16.5px;line-height:1.85;color:#ddd5c8;margin-bottom:16px}
.closing p:last-child{margin-bottom:0}
.closing strong{color:#fff;font-weight:600}
.closing .q{
  margin-top:24px;padding-top:22px;border-top:1px solid #3a352d;
  font-family:Georgia,serif;font-size:19px;line-height:1.6;color:#fff;font-style:italic;
}
/* ---------- SHARE MODAL ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(25,23,19,.74);
  align-items:flex-start;justify-content:center;
  padding:26px 16px 40px;overflow:auto;
  animation:fade .22s ease both;
}
.modal.open{display:flex}
.sheet{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  width:100%;max-width:462px;padding:22px 22px 20px;
  box-shadow:0 34px 90px -44px rgba(0,0,0,.85);
  animation:rise .34s cubic-bezier(.2,.8,.2,1) both;
}
.sheet h3{font-family:Georgia,"Iowan Old Style",serif;font-size:19px;letter-spacing:-.01em;margin-bottom:7px}
.sheet .sub{font-size:12.5px;line-height:1.55;color:var(--ink3);margin-bottom:16px}
.sheet canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:2px;background:#f7f4ef}
.sheetacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheetacts .btn{flex:1 1 44%;text-align:center;padding:12px 14px;font-size:11px;letter-spacing:.1em}
.sheetacts .btn.wide{flex-basis:100%;background:transparent;color:var(--ink3);border-color:var(--line)}
.sheetacts .btn.wide:hover{background:#f3efe8;color:var(--ink);border-color:var(--ink)}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12.5px;letter-spacing:.04em;font-weight:600;
  padding:11px 20px;border-radius:2px;z-index:70;
  animation:fade .2s ease both;box-shadow:0 16px 40px -18px rgba(0,0,0,.7);
}
@media(max-width:600px){
  .card{padding:30px 22px 34px}
  .meters{gap:13px}
  .meter{min-width:70px}
  .meter .lbl{font-size:9px}
  body{padding:16px 12px 70px}
  .hud{gap:12px;padding:12px 14px}
}
</style>

   ENGINE

const LANGS = [
  { id: 'en',   label: 'EN' },
  { id: 'hans', label: '简中' },
  { id: 'hant', label: '繁中' }
];

let lang = 'en';
let state = {};
let view = { type: 'title' };

const stage = document.getElementById('stage');
const hudEl = document.getElementById('hud');

function L() { return T[lang]; }
function U() { return T[lang].ui; }

function resetState() {
  state = {
    cash: START.cash, standing: START.standing, reach: START.reach, time: START.time,
    exec: EXEC_CURVE[0], picks: []
  };
}

function saveLang() { try { localStorage.setItem('egac-lang', lang); } catch (e) {} }
function loadLang() {
  try {
    const v = localStorage.getItem('egac-lang');
    if (v && T[v]) lang = v;
  } catch (e) {}
}

/* ---------------- HUD ---------------- */
function meterHTML(label, val, color) {
  const v = Math.max(2, Math.min(100, val));
  return '<div class="meter">' +
    '<div class="lbl"><span>' + label + '</span><b>' + Math.round(val) + '</b></div>' +
    '<div class="bar"><i style="width:' + v + '%;background:' + color + '"></i></div>' +
  '</div>';
}

function renderHUD() {
  const u = U();
  const ch = state.chapter || 0;
  const dots = L().chapters.map(function (_, i) {
    const cls = i < ch ? 'on' : (i === ch && ch < L().chapters.length ? 'cur' : '');
    return '<div class="dot ' + cls + '"></div>';
  }).join('');

  hudEl.innerHTML =
    '<div class="meters">' +
      meterHTML(u.cash, state.cash, 'var(--cash)') +
      meterHTML(u.standing, state.standing, 'var(--stand)') +
      meterHTML(u.reach, state.reach, 'var(--reach)') +
      meterHTML(u.time, state.time, 'var(--time)') +
    '</div>' +
    '<div class="exec meter">' +
      '<div class="lbl"><span>' + u.exec + '</span><b>' + state.exec + '</b></div>' +
      '<div class="bar"><i style="width:' + state.exec + '%;background:var(--exec)"></i></div>' +
    '</div>' +
    '<div class="hudright">' +
      '<div class="dots">' + dots + '</div>' +
      '<div class="langs">' + LANGS.map(function (l) {
        return '<button data-lang="' + l.id + '" class="' + (l.id === lang ? 'active' : '') + '">' + l.label + '</button>';
      }).join('') + '</div>' +
      '<button class="rst" id="rst">' + u.restart + '</button>' +
    '</div>';

  hudEl.querySelectorAll('[data-lang]').forEach(function (b) {
    b.onclick = function () { setLang(b.getAttribute('data-lang')); };
  });
  const r = document.getElementById('rst');
  if (r) r.onclick = function () { resetState(); view = { type: 'title' }; render(); };
}

/* ---------------- ROUTER ---------------- */
function render() {
  document.documentElement.lang = lang === 'en' ? 'en' : (lang === 'hans' ? 'zh-Hans' : 'zh-Hant');
  document.title = L().docTitle;
  renderHUD();
  if (view.type === 'title')   return renderTitle();
  if (view.type === 'chapter') return renderChapter(view.i);
  if (view.type === 'outcome') return renderOutcome(view.i, view.k);
  if (view.type === 'end')     return renderEnd();
}

function setLang(id) {
  if (!T[id] || id === lang) return;
  lang = id;
  saveLang();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------------- TITLE ---------------- */

  state.exec = EXEC_CURVE[0];

            '<stop offset="1" stop-color="#191713"/>' +
          '</linearGradient></defs>' +
          '<line x1="18" y1="108" x2="404" y2="108" stroke="#ece5d9" stroke-width="1"/>' +
          '<g transform="rotate(-8 210 52)">' +
            '<rect x="100" y="41" width="270" height="14" rx="7" fill="url(#ch)"/>' +
            '<rect x="50" y="12" width="58" height="74" rx="8" fill="#191713"/>' +
            '<rect x="50" y="12" width="16" height="74" rx="8" fill="#a8542a"/>' +
          '</g>' +
        '</svg>' +
      '</div>' +
      '<h1>' + L().docTitle + '</h1>' +
      '<p class="lede">' + u.lede + '</p>' +
      '<div class="prose"><p>' + u.p1 + '</p><p>' + u.p2 + '</p></div>' +
      '<div class="acts">' +
        '<button class="btn" id="go">' + u.begin + '</button>' +
        '<span class="hint">' + u.beginHint + '</span>' +
      '</div>' +
    '</div>';
  document.getElementById('go').onclick = function () {
    view = { type: 'chapter', i: 0 };
    render();
  };
}

/* ---------------- CHAPTER ---------------- */
function renderChapter(i) {
  state.chapter = i;
  state.exec = EXEC_CURVE[i];
  renderHUD();
  const c = L().chapters[i];
  const scene = c.scene.map(function (p) { return '<p>' + p + '</p>'; }).join('');
  const opts = c.options.map(function (o, k) {
    return '<button class="opt" data-k="' + k + '">' +
      '<span class="n">' + (k + 1) + '</span><span>' + o.label + '</span></button>';
  }).join('');

  stage.innerHTML =
    '<div class="card">' +
      '<div class="kicker">' + c.kicker + '</div>' +
      '<h2>' + c.title + '</h2>' +
      '<div class="prose">' + scene + '</div>' +
      '<div class="prompt">' + c.prompt + '</div>' +
      '<div class="opts">' + opts + '</div>' +
    '</div>';

  stage.querySelectorAll('.opt').forEach(function (el) {
    el.onclick = function () { choose(i, parseInt(el.getAttribute('data-k'), 10)); };
  });
}

/* ---------------- CHOICE ---------------- */
function chip(label, v) {
  const cls = v > 0 ? 'up' : (v < 0 ? 'dn' : '');
  const sign = v > 0 ? '+' : (v < 0 ? '\u2212' : '');
  return '<span class="chip ' + cls + '">' + label + ' ' + sign + Math.abs(v) + '</span>';
}

function choose(i, k) {
  const fx = FX[i][k];
  state.picks.push({ c: i, k: k });
  for (const key in fx) {
    state[key] = Math.max(0, Math.min(100, state[key] + fx[key]));
  }
  state.chapter = i;
  view = { type: 'outcome', i: i, k: k };
  render();
}

function renderOutcome(i, k) {
  const u = U();
  const c = L().chapters[i];
  const o = c.options[k];
  const fx = FX[i][k];
  const isLast = i === L().chapters.length - 1;

  const chips = chip(u.cash, fx.cash) + chip(u.standing, fx.standing) +
                chip(u.reach, fx.reach) + chip(u.time, fx.time);
  const outcome = o.outcome.map(function (p) { return '<p>' + p + '</p>'; }).join('');

  stage.innerHTML =
    '<div class="card">' +
      '<div class="kicker">' + c.kicker + ' — ' + u.outcomeSuffix + '</div>' +
      '<h2>' + c.title + '</h2>' +
      '<div class="prose">' + outcome + '</div>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="lesson"><div class="tag">' + u.lessonTag + '</div><p>' + o.lesson + '</p></div>' +
      '<div class="acts">' +
        '<button class="btn" id="next">' + (isLast ? u.last : u.next) + '</button>' +
        '<span class="hint">' + u.nextHint + '</span>' +
      '</div>' +
    '</div>';

  document.getElementById('next').onclick = function () {
    if (isLast) { view = { type: 'end' }; render(); }
    else { view = { type: 'chapter', i: i + 1 }; render(); }
  };
}

/* ---------------- ENDING ---------------- */
function totalScore() {
  return Math.round(state.cash + state.standing + state.reach + state.time);
}
function rankIndex() {
  const total = totalScore();
  for (let n = 0; n < RANK_MIN.length; n++) {
    if (total >= RANK_MIN[n]) return n;
  }
  return RANK_MIN.length - 1;
}

function renderEnd() {
  const u = U();
  const t = L();
  state.chapter = t.chapters.length;
  state.exec = EXEC_CURVE[EXEC_CURVE.length - 1];
  renderHUD();

  const ri = rankIndex();
  const rank = t.ranks[ri];

  const recap = state.picks.map(function (p) {
    return '<li>' + t.chapters[p.c].options[p.k].lesson + '</li>';
  }).join('');

  stage.innerHTML =
    '<div class="card">' +
      '<div class="kicker">' + u.epilogue + '</div>' +
      '<h2>' + u.endTitle + '</h2>' +

      '<div class="rank">' +
        '<div class="rt">' + u.finishedAs + '</div>' +
        '<h3>' + rank.name + '</h3><p>' + rank.text + '</p>' +
      '</div>' +

      '<div class="scoregrid">' +
        '<div class="sg"><div class="k">' + u.cash + '</div><div class="v">' + Math.round(state.cash) + '</div></div>' +
        '<div class="sg"><div class="k">' + u.standing + '</div><div class="v">' + Math.round(state.standing) + '</div></div>' +
        '<div class="sg"><div class="k">' + u.reach + '</div><div class="v">' + Math.round(state.reach) + '</div></div>' +
        '<div class="sg"><div class="k">' + u.time + '</div><div class="v">' + Math.round(state.time) + '</div></div>' +
      '</div>' +

      '<div class="rule"></div>' +
      '<div class="prose"><p>' + t.end.p1 + '</p><p>' + t.end.p2 + '</p></div>' +
      '<div class="rule"></div>' +

      '<div class="kicker">' + u.lessonHeader + '</div>' +
      '<ol class="recap">' + recap + '</ol>' +

      '<div class="closing">' +
        '<div class="tag">' + u.pointTag + '</div>' +
        '<p>' + t.end.c1 + '</p>' +
        '<p>' + t.end.c2 + '</p>' +
        '<p>' + t.end.c3 + '</p>' +
        '<p>' + t.end.c4 + '</p>' +
        '<div class="q">' + t.end.q + '</div>' +
      '</div>' +

      '<div class="acts">' +
        '<button class="btn" id="share">' + u.share + '</button>' +
        '<button class="btn ghost" id="again">' + u.again + '</button>' +
        '<button class="btn ghost" id="fromCh">' + u.replay + '</button>' +
      '</div>' +
      '<div id="chapick" style="display:none;margin-top:14px" class="opts"></div>' +
    '</div>';

  document.getElementById('share').onclick = function () { openShare(); };

  document.getElementById('again').onclick = function () {
    resetState(); view = { type: 'title' }; render();
  };
  document.getElementById('fromCh').onclick = function () {
    const box = document.getElementById('chapick');
    if (box.style.display === 'block') { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.innerHTML = t.chapters.map(function (c, n) {
      return '<button class="opt" data-i="' + n + '">' +
        '<span class="n">' + (n + 1) + '</span><span>' + c.title + '</span></button>';
    }).join('');
    box.querySelectorAll('.opt').forEach(function (el) {
      el.onclick = function () {
        view = { type: 'chapter', i: parseInt(el.getAttribute('data-i'), 10) };
        render();
      };
    });
  };
}

/* ==========================================================================
   SHARE CARD  —  drawn on canvas so the download is pixel-identical
   to the on-screen preview (no html2canvas, no dependencies)
   ========================================================================== */
const F_SERIF = 'Georgia, "Times New Roman", "Songti SC", "STSong", SimSun, "Noto Serif CJK SC", serif';
const F_SANS  = '"Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif';
const NO_LINE_START = '。，、；：？！）》」』】”’…·.,;:?!)]}';

/* CJK chars wrap anywhere; latin words stay whole */
function tokens(str) {
  const out = [];
  let buf = '';
  for (const ch of str) {
    if (/[\u2E80-\u9FFF\u3000-\u303F\uFF00-\uFFEF]/.test(ch)) {
      if (buf) { out.push(buf); buf = ''; }
      out.push(ch);
    } else if (ch === ' ') {
      if (buf) { out.push(buf); buf = ''; }
      out.push(' ');
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  return out;
}

function wrapLines(ctx, text, maxW) {
  const tk = tokens(text);
  const lines = [];
  let cur = '';
  for (let i = 0; i < tk.length; i++) {
    const t = tk[i];
    const test = cur + t;
    if (cur && ctx.measureText(test).width > maxW) {
      if (NO_LINE_START.indexOf(t) >= 0) {
        cur = test;                       /* closing punctuation may overflow slightly */
      } else {
        lines.push(cur.replace(/\s+$/, ''));
        cur = (t === ' ') ? '' : t;
      }
    } else {
      cur = test;
    }
  }
  if (cur.replace(/\s+$/, '')) lines.push(cur.replace(/\s+$/, ''));
  return lines;
}

/* canvas has no letter-spacing — draw glyph by glyph */
function spacedText(ctx, text, x, y, sp) {
  let px = x;
  for (const ch of text) {
    ctx.fillText(ch, px, y);
    px += ctx.measureText(ch).width + sp;
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function buildCard() {
  const u = U(), t = L();
  const W = 1080, H = 1350, PAD = 96, maxW = W - PAD * 2;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const ls = (lang === 'en') ? 3.4 : 1.5;

  /* paper + inset hairline */
  c.fillStyle = '#f7f4ef'; c.fillRect(0, 0, W, H);
  c.strokeStyle = '#e2dbcf'; c.lineWidth = 2;
  c.strokeRect(20, 20, W - 40, H - 40);

  /* hammer mark, top right */
  c.save();
  c.translate(W - PAD - 78, 106);
  c.fillStyle = '#a8542a'; c.fillRect(0, 0, 11, 36);
  c.fillStyle = '#191713'; c.fillRect(11, 0, 24, 36);
  c.fillStyle = '#4a443a'; c.fillRect(16, 31, 62, 11);
  c.restore();

  /* kicker */
  c.font = '700 23px ' + F_SANS;
  c.fillStyle = '#a8542a';
  spacedText(c, t.docTitle.toUpperCase(), PAD, 132, ls);

  c.strokeStyle = '#e2dbcf'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(PAD, 182); c.lineTo(W - PAD, 182); c.stroke();

  /* "you finished as" */
  c.font = '700 23px ' + F_SANS;
  c.fillStyle = '#8c8478';
  spacedText(c, u.finishedAs.toUpperCase(), PAD, 296, ls);

  /* rank name, auto-fitted to the column */
  const rank = t.ranks[rankIndex()];
  let size = 138;
  c.font = '700 ' + size + 'px ' + F_SERIF;
  while (c.measureText(rank.name).width > maxW && size > 54) {
    size -= 4;
    c.font = '700 ' + size + 'px ' + F_SERIF;
  }
  c.fillStyle = '#191713';
  c.fillText(rank.name, PAD, 458);

  /* rank description — auto-fitted so it never exceeds four lines */
  const DESC_TOP = 540, MAX_LINES = 4;
  let dsz = 34, dl = [];
  while (dsz >= 22) {
    c.font = '400 ' + dsz + 'px ' + F_SERIF;
    dl = wrapLines(c, rank.text, maxW);
    if (dl.length <= MAX_LINES) break;
    dsz -= 1;
  }
  if (dl.length > MAX_LINES) {
    dl = dl.slice(0, MAX_LINES);
    dl[MAX_LINES - 1] = dl[MAX_LINES - 1].replace(/\s*\S{0,3}$/, '') + '…';
  }
  c.font = '400 ' + dsz + 'px ' + F_SERIF;
  c.fillStyle = '#4c463d';
  const dlh = Math.round(dsz * 1.6);
  dl.forEach(function (ln, i) { c.fillText(ln, PAD, DESC_TOP + i * dlh); });
  const descEnd = DESC_TOP + (dl.length - 1) * dlh;

  /* the four numbers, one inline line */
  const line = [u.cash + ' ' + Math.round(state.cash),
                u.standing + ' ' + Math.round(state.standing),
                u.reach + ' ' + Math.round(state.reach),
                u.time + ' ' + Math.round(state.time)].join('   ·   ');
  let fs = 28;
  c.font = '600 ' + fs + 'px ' + F_SANS;
  while (c.measureText(line).width > maxW && fs > 17) {
    fs -= 1;
    c.font = '600 ' + fs + 'px ' + F_SANS;
  }
  c.fillStyle = '#4c463d';
  c.fillText(line, PAD, descEnd + 56);

  /* the question — the payload, anchored to the bottom */
  const qPad = 56, qLh = 72;
  c.font = '400 48px ' + F_SERIF;
  const ql = wrapLines(c, t.end.q, maxW - qPad * 2);
  const blockH = qPad * 2 + ql.length * qLh - 20;
  const blockBottom = H - 132;
  const blockTop = blockBottom - blockH;

  c.strokeStyle = '#e2dbcf'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(PAD, blockTop - 66); c.lineTo(W - PAD, blockTop - 66); c.stroke();

  roundRect(c, PAD, blockTop, maxW, blockH, 6);
  c.fillStyle = '#191713'; c.fill();

  c.fillStyle = '#f2ece2';
  ql.forEach(function (ln, i) {
    c.fillText(ln, PAD + qPad, blockTop + qPad + 42 + i * qLh);
  });

  /* footer */
  c.font = '400 23px ' + F_SANS;
  c.fillStyle = '#8c8478';
  c.fillText(u.cardFooter, PAD, blockBottom + 68);

  return cv;
}

function cardText() {
  const u = U(), t = L();
  const rank = t.ranks[rankIndex()];
  return t.docTitle + '\n\n' +
    u.finishedAs + ': ' + rank.name + '\n' + rank.text + '\n\n' +
    u.cash + ' ' + Math.round(state.cash) + '  ·  ' +
    u.standing + ' ' + Math.round(state.standing) + '  ·  ' +
    u.reach + ' ' + Math.round(state.reach) + '  ·  ' +
    u.time + ' ' + Math.round(state.time) + '\n\n' +
    t.end.q;
}

function toast(msg) {
  const old = document.getElementById('toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.id = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.remove(); }, 2400);
}

function closeShare() {
  const m = document.getElementById('shareModal');
  if (m) m.remove();
}

function fallbackCopy(txt, u) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  toast(ok ? u.copied : u.copyFail);
}

function openShare() {
  const u = U();
  const cv = buildCard();

  const m = document.createElement('div');
  m.className = 'modal open';
  m.id = 'shareModal';
  m.innerHTML =
    '<div class="sheet">' +
      '<h3>' + u.shareTitle + '</h3>' +
      '<p class="sub">' + u.shareHint + '</p>' +
      '<div class="cvwrap"></div>' +
      '<div class="sheetacts">' +
        '<button class="btn" id="dl">' + u.download + '</button>' +
        '<button class="btn ghost" id="cp">' + u.copyText + '</button>' +
        '<button class="btn ghost wide" id="cl">' + u.close + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(m);
  m.querySelector('.cvwrap').appendChild(cv);

  m.onclick = function (e) { if (e.target === m) closeShare(); };
  m.querySelector('#cl').onclick = closeShare;

  m.querySelector('#dl').onclick = function () {
    const t2 = L();
    const slug = (lang === 'en')
      ? t2.ranks[rankIndex()].name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
      : 'rank-' + (rankIndex() + 1);
    const fname = 'thor-hammer-' + slug + '.png';
    const save = function (href, revoke) {
      const a = document.createElement('a');
      a.href = href; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      if (revoke) setTimeout(function () { URL.revokeObjectURL(href); }, 2000);
    };
    if (cv.toBlob) {
      cv.toBlob(function (blob) { save(URL.createObjectURL(blob), true); }, 'image/png');
    } else {
      save(cv.toDataURL('image/png'), false);   /* very old browsers */
    }
  };

  m.querySelector('#cp').onclick = function () {
    const txt = cardText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(
        function () { toast(u.copied); },
        function () { fallbackCopy(txt, u); }
      );
    } else {
      fallbackCopy(txt, u);
    }
  };

  /* native share sheet, where the browser can share files */
  if (navigator.canShare) {
    cv.toBlob(function (blob) {
      let file;
      try { file = new File([blob], 'thor-hammer.png', { type: 'image/png' }); }
      catch (e) { return; }
      if (!navigator.canShare({ files: [file] })) return;
      const b = document.createElement('button');
      b.className = 'btn ghost'; b.id = 'sn';
      b.textContent = u.shareNative;
      b.onclick = function () {
        navigator.share({ files: [file], text: cardText() }).catch(function () {});
      };
      const acts = m.querySelector('.sheetacts');
      acts.insertBefore(b, acts.querySelector('#cl'));
    }, 'image/png');
  }
}

/* ---------------- KEYBOARD ---------------- */
document.addEventListener('keydown', function (e) {
  if (document.getElementById('shareModal')) {
    if (e.key === 'Escape') closeShare();
    return;
  }
  const opts = stage.querySelectorAll('.opt');
  if (/^[1-9]$/.test(e.key) && opts.length) {
    const idx = parseInt(e.key, 10) - 1;
    if (idx < opts.length) { opts[idx].click(); return; }
  }
  if (e.key === 'Enter' || e.key === ' ') {
    const btn = stage.querySelector('.acts .btn');
    if (btn) { e.preventDefault(); btn.click(); }
  }
});

/* ---------------- BOOT ---------------- */
loadLang();
resetState();
render();
</script>
